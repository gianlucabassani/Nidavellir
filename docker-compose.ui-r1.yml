name: nidavellir-ui-r1

services:
  poc-runner-image:
    build:
      context: ./cyber-range/services/scenario-orchestrator/infra/poc-runner
    image: nidavellir/poc-runner:py311
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nidavellir_ui_r1
      POSTGRES_USER: nidavellir
      POSTGRES_PASSWORD: ${NV_UI_R1_DB_PASSWORD:?Set NV_UI_R1_DB_PASSWORD in a private env file}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidavellir -d nidavellir_ui_r1"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  orchestrator:
    build:
      context: ./cyber-range/services/scenario-orchestrator
    environment: &orchestrator-env
      MOCK_MODE: "false"
      RANGE_PROVIDER: docker-local
      BOOTSTRAP_API_KEY: ${NV_UI_R1_API_KEY:?Set NV_UI_R1_API_KEY in a private env file}
      BOOTSTRAP_API_KEY_ROLE: admin
      DATABASE_URL: postgresql+psycopg://nidavellir:${NV_UI_R1_DB_PASSWORD:?Set NV_UI_R1_DB_PASSWORD in a private env file}@postgres:5432/nidavellir_ui_r1
      DATA_DIR: /app/data
      RUNS_DIR: /app/runs
      KEYS_DIR: /app/keys
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "false"
      REAPER_INTERVAL_SECONDS: "2"
      LAB_STUCK_MINUTES: "30"
      NIDAVELLIR_POC_STALE_SECONDS: "12"
      NIDAVELLIR_POC_MAX_TIMEOUT_SECONDS: "10"
      NIDAVELLIR_POC_RUNNER_IMAGE: nidavellir/poc-runner:py311
      SECRETS_ENCRYPTION_KEY: ${NV_UI_R1_ENCRYPTION_KEY:?Set NV_UI_R1_ENCRYPTION_KEY in a private env file}
      HTTP_TIMEOUT_SECONDS: "5"
      PYTHONPATH: /app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["18105:8000"]
    volumes:
      - ui_r1-data:/app/data
      - ui_r1-runs:/app/runs
      - ui_r1-keys:/app/keys
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ./cyber-range/services/scenario-orchestrator
    command: celery -A tasks worker --loglevel=info --concurrency=2
    environment: *orchestrator-env
    depends_on:
      poc-runner-image: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      orchestrator: {condition: service_healthy}
    volumes:
      - ui_r1-data:/app/data
      - ui_r1-runs:/app/runs
      - ui_r1-keys:/app/keys
      - /var/run/docker.sock:/var/run/docker.sock

  beat:
    build:
      context: ./cyber-range/services/scenario-orchestrator
    command: celery -A tasks beat --loglevel=info --schedule /tmp/ui_r1-beat
    environment: *orchestrator-env
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  webui:
    build:
      context: ./cyber-range/webui
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      ORCHESTRATOR_API_KEY: ${NV_UI_R1_API_KEY:?Set NV_UI_R1_API_KEY in a private env file}
      SECRET_KEY: ${NV_UI_R1_WEBUI_SECRET:?Set NV_UI_R1_WEBUI_SECRET in a private env file}
      WEBUI_USERNAME: admin
      WEBUI_PASSWORD: ${NV_UI_R1_WEBUI_PASSWORD:?Set NV_UI_R1_WEBUI_PASSWORD in a private env file}
      MOCK_MODE: "false"
    depends_on:
      orchestrator: {condition: service_healthy}
    ports: ["15105:5000"]

  agent-gateway:
    build:
      context: ./cyber-range/services/agent-gateway
    environment:
      NIDAVELLIR_API_URL: http://orchestrator:8000
      NIDAVELLIR_AGENT_KEY: ${NV_UI_R1_AGENT_KEY:?Set NV_UI_R1_AGENT_KEY in a private env file}
      NIDAVELLIR_STANCE: attacker
      NIDAVELLIR_GATEWAY_TRANSPORT: streamable-http
      NIDAVELLIR_GATEWAY_HOST: 0.0.0.0
      NIDAVELLIR_GATEWAY_PORT: "9000"
      NIDAVELLIR_TRACE_DIR: /app/traces
    depends_on:
      orchestrator: {condition: service_healthy}
    ports: ["19105:9000"]
    volumes:
      - ui_r1-traces:/app/traces

volumes:
  ui_r1-data:
  ui_r1-runs:
  ui_r1-keys:
  ui_r1-traces:
