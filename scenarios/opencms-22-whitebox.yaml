# Current Docker-local does not assign node-name DNS aliases. Before startup,
# the operator must add alias mysql on this arena's database network attachment;
# see DEPLOY.md. This file does not change the provider.
schema: nidavellir/v3
name: OpenCms 22 whitebox
requires:
  provider_class: container
network:
  segments:
    - name: cms
nodes:
  - name: victim
    role: victim
    segments: [cms]
    ports: [8080]
    native_startup: true
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWD: arena-only-opencms
      ADMIN_PASSWD: arena-only-admin
      OPENCMS_COMPONENTS: workplace
      JETTY_OPTS: -Xmx768m
    service:
      image: alkacon/opencms-docker:22.0
      whitebox: true
      source:
        repo: https://github.com/alkacon/opencms-core.git
        ref: 5aca15b30ba098beacfd622262e40dce3c7456af
  - name: mysql
    role: database
    image: mariadb:11
    native_startup: true
    segments: [cms]
    environment:
      MARIADB_ROOT_PASSWORD: arena-only-opencms
  - name: attacker
    role: attacker
    image: kali
    entrypoint: true
    segments: [cms]
agents:
  - stance: attacker
    node: attacker
objectives:
  - id: investigate
    description: Authorized whitebox research; no vulnerability asserted.
ttl_hours: 4
